<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24160D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oasisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D8B56D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9973A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6233;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="200" height="200" fill="url(#bgGradient)" />

  <!-- Oasis water (circular center) -->
  <circle cx="100" cy="100" r="40" fill="#2BAE9F" opacity="0.8" />

  <!-- Sand dunes (stylized arcs) -->
  <path d="M 30 120 Q 50 100 80 120 Q 100 135 130 120 Q 150 105 170 120 L 170 200 L 30 200 Z" fill="url(#oasisGradient)" opacity="0.9" />

  <!-- Decorative stars/sparkles -->
  <circle cx="40" cy="30" r="2.5" fill="#D8B56D" opacity="0.6" />
  <circle cx="80" cy="20" r="1.5" fill="#C9973A" opacity="0.5" />
  <circle cx="160" cy="40" r="2" fill="#D8B56D" opacity="0.5" />
  <circle cx="170" cy="80" r="1.5" fill="#2BAE9F" opacity="0.4" />

  <!-- Palm tree silhouette (simple) -->
  <rect x="95" y="65" width="10" height="25" fill="#2BAE9F" opacity="0.9" />
  <circle cx="100" cy="60" r="15" fill="#2BAE9F" opacity="0.85" />
</svg>
